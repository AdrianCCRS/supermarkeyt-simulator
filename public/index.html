<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supermarket Simulator</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
    <!-- ENCABEZADO: estado de la jornada -->
    <header class="topbar">
        <h1>Supermarket Simulator</h1>
        <div id="jornada" class="jornada">
            <span id="jornada-estado">Cargando jornada…</span>
            <button id="btn-abrir-jornada" type="button" hidden>Abrir jornada</button>
            <button id="btn-cerrar-jornada" type="button" hidden>Cerrar jornada</button>
        </div>
    </header>

    <!-- Mensajes (errores de la API, avisos) -->
    <div id="mensaje" class="mensaje" role="status" hidden></div>

    <!-- JUEGO: tienda · banda · caja (Phaser) -->
    <main class="escenario"><div id="game"></div></main>

    <p class="creditos">Iconos de comida: Alex, <em>Free pixel food 16x16</em> (CC BY 4.0) · Fuente: Press Start 2P (OFL) · Ver CREDITS.md</p>

    <!-- TICKET (se llena con la respuesta de /api/checkout.php) -->
    <section id="ticket" class="ticket" hidden></section>

    <script src="assets/js/vendor/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="assets/js/vendor/phaser-3.90.0.min.js"></script>
    <script src="assets/js/money.js"></script>
    <script src="assets/js/pricing.js"></script>
    <script src="assets/js/venta.js"></script>
    <script src="assets/js/auditoria.js"></script>
    <script src="assets/js/cobro.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/phaser/assets.js"></script>
    <script src="assets/js/phaser/CheckoutScene.js"></script>
    <script src="assets/js/phaser/config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

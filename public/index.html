<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supermarket Simulator</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
    <!-- CIELO con nubes y el cartel de la tienda -->
    <div class="cielo" aria-hidden="true">
        <span class="nube n1"></span><span class="nube n2"></span><span class="nube n3"></span>
    </div>
    <header class="cartel">
        <h1>SUPERMARKET<br>SIMULATOR</h1>
    </header>
    <div class="toldo" aria-hidden="true"></div>

    <!-- Mensajes (errores de la API, avisos) -->
    <div id="mensaje" class="mensaje" role="status" hidden></div>

    <!-- CALLE: local · JUEGO (tienda · banda · caja, en Phaser) · local -->
    <div class="calle">
        <div class="local" aria-hidden="true"><img src="assets/img/entorno/fachada-fruteria.png" alt=""><span class="rotulo">FRUTERIA</span></div>
        <main class="escenario"><div id="game"></div></main>
        <div class="local" aria-hidden="true"><img src="assets/img/entorno/fachada-panaderia.png" alt=""><span class="rotulo">PANADERIA</span></div>
    </div>

    <!-- ACERA con clientes paseando -->
    <div class="acera" aria-hidden="true">
        <span class="paseante c1"></span><span class="paseante c2"></span>
        <span class="paseante c3"></span><span class="paseante c4"></span>
    </div>

    <button id="btn-pantalla" class="btn-pantalla" type="button" title="Pantalla grande (tecla F)">PANTALLA GRANDE</button>

    <footer class="creditos">
        Iconos de comida: Alex, <em>Free pixel food 16x16</em> (CC BY 4.0) · Fuente: Press Start 2P (OFL) · Ver CREDITS.md
    </footer>

    <script src="assets/js/vendor/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="assets/js/vendor/phaser-3.90.0.min.js"></script>
    <script src="assets/js/money.js"></script>
    <script src="assets/js/pricing.js"></script>
    <script src="assets/js/venta.js"></script>
    <script src="assets/js/auditoria.js"></script>
    <script src="assets/js/cobro.js"></script>
    <script src="assets/js/compra.js"></script>
    <script src="assets/js/reloj.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/phaser/assets.js"></script>
    <script src="assets/js/phaser/CheckoutScene.js"></script>
    <script src="assets/js/phaser/ControlJornada.js"></script>
    <script src="assets/js/phaser/HudScene.js"></script>
    <script src="assets/js/phaser/config.js"></script>
    <script src="assets/js/pantalla.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

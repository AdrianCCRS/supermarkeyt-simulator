# Tiendas D2 Simulator en contenedores (podman-compose o docker compose).
#   cd deploy && cp env.example .env && nano .env
#   podman-compose up -d --build
# Dos contenedores en su propia red privada: la base NO se publica al servidor, solo el juego, y solo en 127.0.0.1.

name: tiendas-d2

services:
  db:
    image: docker.io/library/mariadb:10.11
    container_name: d2-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?falta DB_ROOT_PASS en deploy/.env}
      MARIADB_DATABASE: ${DB_NAME:-supermarket_simulator}
      MARIADB_USER: ${DB_USER:?falta DB_USER en deploy/.env}
      MARIADB_PASSWORD: ${DB_PASS:?falta DB_PASS en deploy/.env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez (con el volumen vacío), en orden alfabético. No se usa seed.sql: borra tablas.
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
      - ../database/productos_juego.sql:/docker-entrypoint-initdb.d/02-productos.sql:ro,Z
      - ../database/precios_cop.sql:/docker-entrypoint-initdb.d/03-precios.sql:ro,Z
      - ./db/99-permisos.sh:/docker-entrypoint-initdb.d/99-permisos.sh:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges"]
    mem_limit: 384m
    pids_limit: 200
    networks: [interna]

  web:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/d2-web:latest
    container_name: d2-web
    restart: always
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-supermarket_simulator}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?falta ADMIN_TOKEN en deploy/.env}
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]       # Apache arranca como root del contenedor y sus procesos pasan a www-data
    security_opt: ["no-new-privileges"]
    mem_limit: 256m
    pids_limit: 200
    networks: [interna]

volumes:
  db-data:

networks:
  interna:
